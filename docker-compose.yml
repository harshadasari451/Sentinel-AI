services:
  api:
    build: .
    environment:
      APP_ENV: local
      APP_VERSION: 0.1.0
      GIT_SHA: compose
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 3
